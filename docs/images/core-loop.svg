<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">The lean loop</title>
<desc id="d">Define the gap, then Check what exists. If it exists, reuse it and go straight to Verify. If there is a real gap, make the smallest safe fix, then Verify. If verification fails, fix the root cause and verify again. When it passes, ship.</desc>
<style>
svg{--card:#f6f8fa;--node:#ffffff;--ink:#1f2933;--muted:#5d6b7a;--line:#c3ccd6;--on:#0e7c86;--onbg:#e3f4f5;--fail:#b4590b;--failbg:#fdf0e3;--pass:#1a7f37;--passbg:#e6f4ea;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){svg{--card:#141a21;--node:#1b232d;--ink:#e6edf3;--muted:#98a6b3;--line:#3b4654;--on:#3cc3c9;--onbg:#123236;--fail:#e6a23c;--failbg:#3a2a12;--pass:#3fb950;--passbg:#14301c}}
.card{fill:var(--card)}
.box{fill:var(--node);stroke:var(--line);stroke-width:1.25}
.t{fill:var(--ink);font-size:14px;font-weight:600;text-anchor:middle}
.s{fill:var(--muted);font-size:11px;text-anchor:middle}
.lb{fill:var(--muted);font-size:11.5px;text-anchor:middle}
.ko{fill:var(--card)}
.c{color:var(--line)}
.c path{stroke:currentColor;stroke-width:1.75;fill:none}
.c path.hd{fill:currentColor;stroke:none}
.alt path{stroke-dasharray:5 5}
.anim .n1 .box{animation:n1 10s ease-in-out infinite}
.anim .n2 .box{animation:n2 10s ease-in-out infinite}
.anim .n3 .box{animation:n3 10s ease-in-out infinite}
.anim .n4 .box{animation:n4 10s ease-in-out infinite}
.anim .n5 .box{animation:n5 10s ease-in-out infinite}
.anim .c1{animation:c1 10s ease-in-out infinite}
.anim .c2{animation:c2 10s ease-in-out infinite}
.anim .c3{animation:c3 10s ease-in-out infinite}
.anim .c4{animation:c4 10s ease-in-out infinite}
.anim .lp{animation:lp 10s ease-in-out infinite}
@keyframes n1{0%,9%{stroke:var(--on);fill:var(--onbg);stroke-width:2}12%,100%{stroke:var(--line);fill:var(--node);stroke-width:1.25}}
@keyframes n2{0%,13%,26%,100%{stroke:var(--line);fill:var(--node);stroke-width:1.25}15%,23%{stroke:var(--on);fill:var(--onbg);stroke-width:2}}
@keyframes n3{0%,27%,40%,57%,68%,100%{stroke:var(--line);fill:var(--node);stroke-width:1.25}29%,37%,59%,65%{stroke:var(--on);fill:var(--onbg);stroke-width:2}}
@keyframes n4{0%,41%,54%,69%,82%,100%{stroke:var(--line);fill:var(--node);stroke-width:1.25}43%,51%{stroke:var(--fail);fill:var(--failbg);stroke-width:2}71%,79%{stroke:var(--pass);fill:var(--passbg);stroke-width:2}}
@keyframes n5{0%,83%,100%{stroke:var(--line);fill:var(--node);stroke-width:1.25}85%,97%{stroke:var(--pass);fill:var(--passbg);stroke-width:2}}
@keyframes c1{0%,7%,18%,100%{color:var(--line)}9%,15%{color:var(--on)}}
@keyframes c2{0%,21%,32%,100%{color:var(--line)}23%,29%{color:var(--on)}}
@keyframes c3{0%,35%,46%,63%,74%,100%{color:var(--line)}37%,43%,65%,71%{color:var(--on)}}
@keyframes c4{0%,77%,88%,100%{color:var(--line)}79%,85%{color:var(--pass)}}
@keyframes lp{0%,49%,62%,100%{color:var(--line)}51%,59%{color:var(--fail)}}
@media (prefers-reduced-motion:reduce){.anim *{animation:none!important}}
</style>
<rect class="card" width="900" height="210" rx="14"/>
<g class="anim">
<g class="c alt"><path d="M270,66 C270,14 630,14 630,58"/><path class="hd" d="M624,56 L630,67 L636,56 Z"/></g>
<rect class="ko" x="388" y="17" width="124" height="18"/>
<text class="lb" x="450" y="30">exists: reuse it</text>
<g class="c lp"><path d="M630,134 C630,192 450,192 450,144"/><path class="hd" d="M444,144 L450,133 L456,144 Z"/></g>
<rect class="ko" x="452" y="168" width="176" height="18"/>
<text class="lb" x="540" y="181">fails: fix the root cause</text>
<g class="c c1"><path d="M164,100 H188"/><path class="hd" d="M187,94 L197,100 L187,106 Z"/></g>
<g class="c c2"><path d="M344,100 H368"/><path class="hd" d="M367,94 L377,100 L367,106 Z"/></g>
<text class="lb" x="359" y="88">gap</text>
<g class="c c3"><path d="M524,100 H548"/><path class="hd" d="M547,94 L557,100 L547,106 Z"/></g>
<g class="c c4"><path d="M704,100 H728"/><path class="hd" d="M727,94 L737,100 L727,106 Z"/></g>
<g class="n n1"><rect class="box" x="20" y="68" width="140" height="64" rx="10"/><text class="t" x="90" y="96">Define the gap</text><text class="s" x="90" y="114">what is really missing</text></g>
<g class="n n2"><path class="box" d="M200,100 L218,68 H322 L340,100 L322,132 H218 Z"/><text class="t" x="270" y="96" style="font-size:13px">Check what exists</text><text class="s" x="270" y="114">already built in?</text></g>
<g class="n n3"><rect class="box" x="380" y="68" width="140" height="64" rx="10"/><text class="t" x="450" y="96">Smallest safe fix</text><text class="s" x="450" y="114">only for a real gap</text></g>
<g class="n n4"><rect class="box" x="560" y="68" width="140" height="64" rx="10"/><text class="t" x="630" y="96">Verify</text><text class="s" x="630" y="114">check the real result</text></g>
<g class="n n5"><rect class="box" x="740" y="68" width="140" height="64" rx="10"/><text class="t" x="810" y="96">Ship</text><text class="s" x="810" y="114">outcome confirmed</text></g>
</g>
</svg>
